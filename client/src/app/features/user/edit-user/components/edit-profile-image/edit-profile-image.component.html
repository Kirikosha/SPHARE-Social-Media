<div class="profile-image-section">
  <div class="profile-image-wrapper">

    <img [src]="imagePreview || userProfileUrl || 'assets/user.png'"
         alt="Profile"
         class="profile-image">

    <input id="profileImage"
           type="file"
           accept="image/*"
           (change)="onFileChange($event)"
           class="d-none">

    <label for="profileImage" class="edit-image-button" title="Change photo">
      <i class="bi bi-camera-fill"></i>
    </label>

    <app-save-button
      *ngIf="selectedFile"
      [disabled]="!selectedFile"
      (actionClick)="updateProfileImage()">
    </app-save-button>

    <button type="button"
            class="remove-image-button"
            *ngIf="userProfileUrl !== 'assets/user.png' && !selectedFile"
            (click)="deleteProfileImage()"
            title="Remove photo">
      <i class="bi bi-x"></i>
    </button>

  </div>
</div>
