<div class="sidebar">
  <div class="sidebar-banner"></div>
  <div class="sidebar-body">
    <app-avatar
      [imageUrl]="userProfile?.imageUrl ?? undefined"
      [blocked]="userProfile?.blocked ?? false">
    </app-avatar>
    <div class="identity">
      <div class="display-name"></div>
      <div class="handle"></div>
      <div class="joined"></div>
    </div>
    <div class="stats-row">
      <div class="stat"></div>
      <div class="stat"></div>
    </div>
    <button class="edit-btn"></button>
    <div class="divider"></div>
    <div class="about-section">
      <div class="section-label"></div>
      <div class="meta-row"></div>
      <div class="bio"></div>
      <div class="meta-row"></div>
      <div class="meta-row"></div>
    </div>
    <div class="divider"></div>
    <div class="interests-section">
      <div class="section-label"></div>
      <div class="pills-row">
        <span class="pill"></span>
        <span class="pill"></span>
        <span class="pill"></span>
        <span class="pill"></span>
      </div>
    </div>
  </div>
</div>
