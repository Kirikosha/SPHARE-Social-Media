<div class="profile-image-section">

  <div class="profile-image-wrapper">

    <img [src]="imagePreview || userProfileUrl || 'assets/user.png'"
         alt="Profile"
         class="profile-image">

    <input #fileInput
           id="profileImage"
           type="file"
           accept="image/*"
           (change)="onFileChange($event)"
           class="d-none">
  </div>

  <div class="profile-image-actions">

    <label for="profileImage"
           class="edit-image-button"
           [title]="hasCustomImage ? 'Change photo' : 'Add photo'"
           [style.background-color]="hasCustomImage ? 'var(--button-edit-col)' : 'var(--primary-col)'">

      <i class="bi"
         [ngClass]="hasCustomImage ? 'bi-pencil edit-col' : 'bi-plus'">
      </i>

    </label>

    <app-save-button
      *ngIf="selectedFile"
      [disabled]="!selectedFile"
      (actionClick)="updateProfileImage()">
    </app-save-button>

    <button type="button"
            class="reset-preview-button"
            *ngIf="selectedFile"
            (click)="resetPreview()"
            title="Cancel selection">
      <i class="bi bi-arrow-counterclockwise"></i>
    </button>

    <button type="button"
            class="remove-image-button"
            *ngIf="userProfileUrl && userProfileUrl !== 'assets/user.png' && !selectedFile"
            (click)="deleteProfileImage()"
            title="Remove photo">
      <i class="bi bi-x"></i>
    </button>

  </div>

</div>
