<div class="profile-container">
  @if (memberModel && !isLoading) {
    <div class="profile-header">
      <div class="profile-info-section">
        <app-avatar
          [imageUrl]="memberModel.imageUrl"
          [blocked]="memberModel.blocked">
        </app-avatar>
          
        <div class="profile-actions">
          @if (isCurrentUserProfile) {
            <button class="button-for-edit" (click)="goToUpdate()">
              Edit profile
            </button>
          } @else {
            <button class="btn rounded-pill follow-button" 
                    [class.btn-primary]="!isFollowing"
                    [class.btn-outline-primary]="isFollowing"
                    [disabled]="memberModel.blocked || accountService.currentUser()?.blocked"
                    (click)="toggleFollow()">
              @if (isFollowing) {
                Following
              } @else {
                Follow
              }
            </button>
            <button class="btn rounded-pill" (click)="openChat()">Start chatting</button>
          }
        </div>
        
        <div class="profile-details mt-2">
          <div class="d-flex align-items-center">
            <h2 class="profile-name">{{memberModel.username}}</h2>
            @if (memberModel.blocked) {
              <span class="badge bg-danger ms-2">
                <i class="bi bi-lock-fill"></i> Blocked
              </span>
            }
          </div>
          <h2 class="profile-unique-name">&#64;{{memberModel.uniqueNameIdentifier}}</h2>
          <p class="text-muted">Joined {{memberModel.joinedAt}}</p>
          
          <div class="profile-stats d-flex mt-3">
            <div class="me-4">
              <span class="fw-bold pright">{{followingCount}}</span> 
              <span class="text-muted">Following</span>
            </div>
            <div>
              <span class="fw-bold pright">{{followersCount}}</span> 
              <span class="text-muted">Followers</span>
            </div>
          </div>

          <!-- Decomposed Components -->
          <app-details [userProfileDetails]="memberModel.userProfileDetails"></app-details>
          <app-interests [interests]="memberModel.userProfileDetails?.interests || []"></app-interests>
          <app-address [address]="memberModel.address"></app-address>
        </div>
      </div>
    </div>
  
    <!-- Tabs Section -->
    <div class="profile-tabs mt-4">
      <app-profile-tabs></app-profile-tabs>
    </div>
  } @else {
    <div class="loading-spinner d-flex justify-content-center align-items-center" style="height: 300px;">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }
</div>
