<header [class.scrolled]="isScrolled">
  <div class="container">

    <!-- Brand -->
    <span class="nav-brand" routerLink="/">
      <span class="brand-icon">S</span>
      SPHARE
    </span>

    <!-- Main nav (hidden on mobile unless open) -->
    <nav class="main-nav" [class.open]="isMenuOpen">
      <ul>
        @if (accountService.currentUser()) {
          <li>
            <a (click)="goToProfile()" routerLinkActive="active" class="nav-link">Profile</a>
          </li>
          <li>
            <a routerLink="/publications/calendar" routerLinkActive="active" class="nav-link">Calendar</a>
          </li>
          <li>
            <a routerLink="/search" routerLinkActive="active" class="nav-link">Search</a>
          </li>
          <li>
            <a routerLink="/recommended-publications" routerLinkActive="active" class="nav-link">Recommendations</a>
          </li>
        }
        @if (accountService.currentUser()?.role === 'Admin') {
          <li>
            <a routerLink="/admin-panel" routerLinkActive="active" class="nav-link">Admin</a>
          </li>
        }
      </ul>

      <!-- Right-side actions -->
      <div class="nav-actions">
        @if (accountService.currentUser()) {
        <div dropdown placement="bottom right" class="dropdown">
          <a dropdownToggle class="dropdown-toggle text-decoration-none">
            Welcome {{ accountService.currentUser()?.username }}
          </a>
          <div *dropdownMenu class="dropdown-menu">
            <a class="dropdown-item" (click)="logout()">Logout</a>
          </div>
        </div>
        } @else {
          <button class="btn btn-ghost" routerLink="/login">Log in</button>
          <button class="btn btn-primary" routerLink="/register">Register</button>
        }
      </div>
    </nav>

    <!-- Mobile hamburger -->
    <button
      class="nav-toggle"
      [class.active]="isMenuOpen"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <span></span><span></span><span></span>
    </button>

  </div>
</header>
